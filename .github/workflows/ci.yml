name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Round-trip idempotency suite (spec §5.1): serialize(parse(fixture))
      # must equal fixture for every file in tests/fixtures.
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Build the Docker image and boot it once, so Dockerfile or entrypoint rot
  # shows up in the PR rather than on someone's server.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: blogide:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose file renders
        run: docker compose config --quiet
      - name: Boot with runtime Supabase config
        run: |
          docker run -d --name blogide -p 3000:3000 \
            -e NEXT_PUBLIC_SUPABASE_URL=https://ci-check.supabase.co \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key \
            blogide:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/manifest.webmanifest && break
            sleep 2
          done
          docker logs blogide
          curl -fsS -o /dev/null http://127.0.0.1:3000/manifest.webmanifest
          # Every build-time sentinel must have been replaced.
          ! docker exec blogide grep -rqF blogide-runtime-supabase .next
          docker exec blogide grep -rqF https://ci-check.supabase.co .next/static

  # Apply pending files in supabase/migrations to the linked project.
  # Requires repo secrets (see README). Skips cleanly when unset (e.g. forks).
  migrate:
    name: Apply Supabase migrations
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check migration secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Supabase migrate — set SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, and SUPABASE_PROJECT_ID repository secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: latest

      - name: Link project and push migrations
        if: steps.secrets.outputs.configured == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push
