<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlogIDE · Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf9f6;
        --fg: #1c1b16;
        --muted: #6f6b60;
        --accent: #2f6b4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14130f;
          --fg: #f3f0e7;
          --muted: #9a968a;
          --accent: #4d9a75;
        }
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main {
        align-items: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100dvh;
        padding: 1.5rem;
        text-align: center;
      }
      .kicker {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        margin: 0 0 0.75rem;
        text-transform: uppercase;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 0.75rem;
        max-width: 28rem;
      }
      .count {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 2rem;
        font-variant-numeric: tabular-nums;
        margin: 0.25rem 0 1rem;
      }
      button {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        border: 1px solid var(--accent);
        border-radius: 6px;
        color: var(--accent);
        cursor: pointer;
        font-size: 0.9rem;
        padding: 0.45rem 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">BlogIDE</p>
      <h1>Can’t reach the site</h1>
      <p>
        This device is offline or a network filter is blocking BlogIDE. Retrying
        automatically.
      </p>
      <p class="count" id="count" role="status" aria-live="polite">10</p>
      <button type="button" id="retry">Try now</button>
    </main>
    <script>
      var DELAY_MS = 10000;
      var count = document.getElementById("count");
      var timer = null;
      var deadline = 0;
      var probing = false;

      function probeEditor() {
        var controller = new AbortController();
        var abortTimer = setTimeout(function () {
          controller.abort();
        }, 3000);
        return fetch("/editor", {
          cache: "no-store",
          signal: controller.signal,
        }).finally(function () {
          clearTimeout(abortTimer);
        });
      }

      function remainingSec() {
        return Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      }

      function startCountdown() {
        probing = false;
        deadline = Date.now() + DELAY_MS;
        count.textContent = String(remainingSec());
        if (timer) clearInterval(timer);
        timer = setInterval(function () {
          var left = remainingSec();
          count.textContent = String(left);
          if (left <= 0) {
            clearInterval(timer);
            timer = null;
            tryAgain();
          }
        }, 250);
      }

      function tryAgain() {
        if (probing) return;
        probing = true;
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
        count.textContent = "…";
        probeEditor()
          .then(function (res) {
            if (res && res.ok) {
              location.replace("/editor");
              return;
            }
            startCountdown();
          })
          .catch(function () {
            startCountdown();
          });
      }

      document.getElementById("retry").addEventListener("click", tryAgain);
      startCountdown();
    </script>
  </body>
</html>
