<h2>Reset your BlogIDE password</h2>
<p>Someone asked to reset the password for {{ .Email }}. If that was you, follow this link to choose a new one:</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset/confirm">Reset password</a>
</p>
<p>If you didn't ask for this, you can ignore this email. Your password stays the same.</p>
